name: govulncheck
# Kept apart from the test workflow: govulncheck reads a live vulnerability
# database, so a new Go advisory can turn it red with no code change. Only
# this job goes red then; the fix is usually a toolchain bump in go.mod.
on:
  pull_request:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
