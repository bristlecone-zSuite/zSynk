name: Synk
options:
  bundleIdPrefix: com.zyniker
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  Synk:
    type: application
    platform: macOS
    sources:
      - path: apps/macos/Synk
      - path: apps/shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyniker.synk
        PRODUCT_NAME: Synk
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_CFBundleDisplayName: Synk
        # Ad-hoc signed so a build runs on this Mac without a developer
        # account. Release signing with a Developer ID identity needs the
        # maintainer's Apple account; see STATUS.md, "Needs the Maintainer".
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        # A separate debug dylib breaks test bundles that link the app on
        # newer toolchains, and the app doesn't need it.
        ENABLE_DEBUG_DYLIB: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
    postBuildScripts:
      - name: Bundle the synk daemon
        # The app carries the engine. `make build` makes bin/synk; the app
        # runs it from its own bundle's MacOS folder, named synk-daemon —
        # "synk" would overwrite the app binary itself on the
        # case-insensitive volume (Synk vs synk).
        #
        # The copy happens after Xcode has signed the app, so when signing
        # is enabled the daemon is signed here (hardened runtime; a Go
        # binary needs no special entitlements) and the app is re-signed to
        # seal it as nested code. With CODE_SIGNING_ALLOWED=NO (tests) only
        # the copy happens.
        script: |
          set -euo pipefail
          for candidate in "${SRCROOT}/bin/synk" "${PROJECT_DIR}/bin/synk"; do
            if [ -f "$candidate" ]; then
              DAEMON_SRC="$candidate"
              break
            fi
          done
          if [ -z "${DAEMON_SRC:-}" ]; then
            (cd "${PROJECT_DIR}" && make build)
            DAEMON_SRC="${PROJECT_DIR}/bin/synk"
          fi
          APP="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app"
          cp "$DAEMON_SRC" "$APP/Contents/MacOS/synk-daemon"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "NO" ]; then
            exit 0
          fi
          codesign --force --options runtime \
            --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" \
            "$APP/Contents/MacOS/synk-daemon"
          codesign --force --options runtime --preserve-metadata=entitlements \
            --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$APP"
        outputFiles: []
        basedOnDependencyAnalysis: false
  SynkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: apps/tests
    dependencies:
      - target: Synk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
  Synk-iOS:
    type: application
    platform: iOS
    sources:
      - path: apps/ios/Synk
      - path: apps/shared
    dependencies:
      # The framework is a build product (make ios-framework), generated
      # from the mobile package by gomobile; see decision 0009.
      - framework: apps/ios/Frameworks/SynkCore.xcframework
        embed: true
      # The File Provider extension (decision 0011): Files → On My iPhone
      # → Synk shows the synced libraries. An app-extension dependency on
      # an application target is embedded by default (XcodeGen has no
      # top-level `embed:` key — an earlier attempt used one and XcodeGen
      # ignored it, so the extension was silently missing from the app).
      - target: SynkFileProvider
    entitlements:
      path: apps/ios/Synk/Synk.entitlements
    # An explicit Info.plist, not INFOPLIST_KEY_ settings: Xcode's
    # generated-plist keys silently drop the ones they don't know
    # (UIFileSharingEnabled vanished that way), and these two keys are
    # what makes Documents visible as Files → On My iPhone → Synk, with
    # the files openable in place by the apps that read those formats
    # (decision 0010).
    info:
      path: apps/ios/Synk/Info.plist
      properties:
        CFBundleDisplayName: Synk
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: "Synk syncs your documents directly with your Mac over your local network."
        NSCameraUsageDescription: "Synk uses the camera to read the pairing QR code your Mac shows."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyniker.synk
        PRODUCT_MODULE_NAME: Synk
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_VERSION: "5.10"
        ENABLE_DEBUG_DYLIB: NO
  SynkFileProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: apps/ios-fileprovider
      - path: apps/shared
    # The extension is a read-only view of the app group container
    # (decision 0011); it never runs the engine.
    entitlements:
      path: apps/ios-fileprovider/SynkFileProvider.entitlements
    info:
      path: apps/ios-fileprovider/Info.plist
      properties:
        CFBundleDisplayName: Synk File Provider
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: SynkFileProvider.FileProviderManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyniker.synk.fileprovider
        # Match the app: without it xcodegen defaults the target to the
        # newest SDK, which no installed simulator may satisfy.
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_VERSION: "5.10"
        ENABLE_DEBUG_DYLIB: NO
  SynkIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: apps/ios-tests
    dependencies:
      - target: Synk-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Match the app: without it xcodegen defaults the test target to
        # the newest SDK, which no installed simulator may satisfy
        # ("doesn't match … deployment target" in CI).
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
schemes:
  Synk:
    build:
      targets:
        Synk: all
        SynkTests: [test]
    test:
      targets:
        - SynkTests
  Synk-iOS:
    build:
      targets:
        Synk-iOS: all
        SynkIOSTests: [test]
    test:
      targets:
        - SynkIOSTests
